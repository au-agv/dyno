#############################################################################

[project]
name = "pydyno"
version = "1.0.0"
description = "Autonomous Ground Vehicle Dynamics Testbed"
authors = [{name = "Dario Sirangelo", email = "dsi@aarhusrobotics.com"}]
readme = "README.md"
include = [{ path = "pydyno/data", format = ["sdist", "wheel"]}]

[tool.poetry.dependencies]
brotli = "^1.2.0"
coloredlogs = "^15.0.1"
dash = "^2.15.0"
dtale = "<=3.16.1"
matplotlib = "^3.8.2"
filedialpy = "^1.2.2"
h5py = "^3.11.0"
kaleido = "=0.2.0"
natsort = "^8.4.0"
numpy = "^1.14.5"
python = "^3.10"
pandas = "^2.2.0"
pypdf = "^6.1.3"
rosbags = "^0.10.7"
scipy = "^1.14.1"
tables = "3.9.2"
pyqt6 = "^6.10.0"
pyyaml = "^6.0.2"
requests = "^2.32.4"
urllib3 = "^2.5.0"

[tool.poetry.group.training]
optional = true

[tool.poetry.group.training.dependencies]
cmake = "^3.27"
ninja = "^1.11"
scikit-build = "^0.15.0"
scikit-learn = "^1.5.2"
torch = { version = "2.4.0", source="torch"}
tqdm = "^4.67.1"

[tool.poetry.group.documentation]
optional = true

[tool.poetry.group.documentation.dependencies]
breathe = "^4.36.0"
myst-parser = "^4.0.1"
pydata-sphinx-theme = "^0.16.1"
sphinx = "^8.1.3"

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu121"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
pydyno_postprocessor = 'pydyno.postprocessor:main'