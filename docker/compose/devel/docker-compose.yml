services:
  dyno:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      #- DISPLAY=host.docker.internal:0.0
      - MESA_LOADER_DRIVER_OVERRIDE=i965
      - LIBGL_ALWAYS_SOFTWARE=1
    image: au-agv/dyno:latest
    ports: [ 5555 ]
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true
    volumes:
      - ./:/home/dyno
      - /tmp/.X11-unix:/tmp/.X11-unix
